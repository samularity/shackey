name: shackey CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '24 12 * * 2,5'
#when new src and at 12:24 on Tuesday and Friday.

permissions:
  contents: write

jobs:
  cppcheck:
    # static code analysis, only own code (src/ include/), no sdk / submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --version
          cppcheck --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --platform=unix32 --std=c++17 -I include \
            -D'MACSTR="%02x:%02x:%02x:%02x:%02x:%02x"' \
            -D'ESP_IDF_VERSION_VAL(a,b,c)=(((a)<<16)|((b)<<8)|(c))' \
            -DESP_IDF_VERSION=0x050500 \
            --error-exitcode=1 \
            --template='{file}:{line}: [{severity}] {message} [{id}]' \
            src

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update libssh2 to latest master
        if: github.event_name != 'push'
        run: |
          git submodule update --remote components/libssh2/libssh2
          git -C components/libssh2/libssh2 log -1 --format='libssh2 %h %cd %s'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Commit libssh2 update
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- components/libssh2/libssh2; then
            echo "libssh2 already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/libssh2/libssh2
          git commit -m "update libssh2 to $(git -C components/libssh2/libssh2 rev-parse --short HEAD)"
          git push

      - name: get short hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.vars.outputs.sha_short }}.bin
          path: .pio/build/esp32-c3-devkitm-1/firmware.bin
