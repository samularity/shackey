name: shackey CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '24 12 * * 2,5'
#when new src and at 12:24 on Tuesday and Friday.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update libssh2 to latest master
        if: github.event_name != 'push'
        run: |
          git submodule update --remote components/libssh2/libssh2
          git -C components/libssh2/libssh2 log -1 --format='libssh2 %h %cd %s'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Commit libssh2 update
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- components/libssh2/libssh2; then
            echo "libssh2 already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/libssh2/libssh2
          git commit -m "update libssh2 to $(git -C components/libssh2/libssh2 rev-parse --short HEAD)"
          git push

      - name: get short hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # bootloader + partition table + app in one image, flash to 0x0
      # ends before the spiffs partition, keys on the device are kept
      - name: Create shackey.bin
        run: |
          B=.pio/build/esp32-c3-devkitm-1
          mkdir -p site
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32c3 merge_bin -o site/shackey.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: shackey-${{ steps.vars.outputs.sha_short }}.bin
          path: site/shackey.bin

      # web flasher + download on github pages (CORS friendly, release assets are not)
      - name: Prepare web flasher
        if: github.ref == 'refs/heads/main'
        run: |
          cp webflasher/index.html site/
          cat > site/manifest.json <<EOM
          {
            "name": "shackey",
            "version": "${{ steps.vars.outputs.sha_short }} ($(date -u +%Y-%m-%d))",
            "new_install_prompt_erase": false,
            "new_install_improv_wait_time": 0,
            "builds": [
              { "chipFamily": "ESP32-C3", "parts": [ { "path": "shackey.bin", "offset": 0 } ] }
            ]
          }
          EOM
          cat site/manifest.json

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
