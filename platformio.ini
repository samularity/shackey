[env:esp32-c3-devkitm-1]
; pinned: 6.13.0 ships ESP-IDF 5.5.x (mbedTLS 3.6). IDF 6.x ships mbedTLS 4, which
; libssh2 does not support yet (see libssh2 PR #2284).
platform = platformio/espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf

upload_protocol = esp-builtin
board_build.flash_mode = dio

monitor_speed = 115200
monitor_raw = yes

board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/root.html
